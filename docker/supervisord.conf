[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
childlogdir=/tmp

; 供配置页（appuser）通过 XML-RPC 启停子进程
[unix_http_server]
file=/run/supervisor.sock
chown=appuser:appuser
chmod=0660

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; 子进程继承 supervisord 的环境变量（由 entrypoint 统一 export），
; 避免 environment= 的逗号分隔值（如 AMANE_SAFE_DIRS）被错误解析。

[program:mihomo]
command=/usr/local/bin/start-mihomo.sh
directory=/data/mihomo
user=appuser
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:amane]
command=/app/.venv/bin/python -m amane.server
directory=/app
user=appuser
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:console]
command=/usr/local/bin/start-console.sh
directory=/opt/console
user=appuser
priority=30
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
