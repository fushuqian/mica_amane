services:
  stack:
    image: kenzong/mica-amane:latest
    container_name: amane-stack
    restart: unless-stopped
    env_file: .env
    environment:
      # 配置页「进入 amane」按钮用，与下面 amane 端口映射的宿主端口保持一致
      AMANE_PUBLIC_PORT: "${AMANE_PORT:-8000}"
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${AMANE_PORT:-8000}:8000"   # amane Web/API
      - "${BIND_ADDR:-0.0.0.0}:${PANEL_PORT:-8088}:8088"  # 配置页
      # 7890 混合代理与 9090 Clash API 只在容器内使用，不映射
    volumes:
      - ./data:/data
      - "${MEDIA_DIR:-./media}:/media"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # 可选：公网 HTTPS 反代。启用：
  #   docker compose --profile public up -d
  # 同时把 .env 里的 BIND_ADDR 改为 127.0.0.1，让 8000/8088 只回环可达。
  caddy:
    image: caddy:2-alpine
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      stack:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      PANEL_USER: ${PANEL_USER}
      PANEL_PASSWORD_HASH: ${PANEL_PASSWORD_HASH}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data: {}
  caddy_config: {}
